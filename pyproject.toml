[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archdiag"
version = "0.2.0"
description = "OpenShift must-gather and oc adm inspect to architecture diagrams"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "graphviz",
    "diagrams",
    "mcp>=1.0.0,<2",
]

[project.scripts]
archdiag-mcp = "archdiag.mcp_server:main"
